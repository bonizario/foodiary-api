createMeal:
  handler: src/main/functions/meals/create-meal.handler
  events:
    - httpApi:
        method: POST
        path: /meals
        authorizer:
          name: CognitoAuthorizer

listMealsByDay:
  handler: src/main/functions/meals/list-meals-by-day.handler
  events:
    - httpApi:
        method: GET
        path: /meals
        authorizer:
          name: CognitoAuthorizer

getMealById:
  handler: src/main/functions/meals/get-meal-by-id.handler
  events:
    - httpApi:
        method: GET
        path: /meals/{mealId}
        authorizer:
          name: CognitoAuthorizer

onMealImageUploaded:
  handler: src/main/functions/meals/on-meal-image-uploaded.handler
  events:
    - s3:
        bucket: !Ref MealsBucket
        event: s3:ObjectCreated:*
        existing: true
        forceDeploy: true

processMeal:
  handler: src/main/functions/meals/process-meal.handler
  memorySize: 1024
  timeout: 120
  events:
    - sqs:
        arn: !GetAtt MealsQueue.Arn
        batchSize: 2
